<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3 Imports | Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #000000;
            --accent: #ffffff;
            --text-muted: #888888;
            --border-color: rgba(255, 255, 255, 0.1);
            --search-bg: rgba(255, 255, 255, 0.08);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --autoplay-duration: 6000ms; /* Sincronizado com JS */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0a0a0a; color: var(--accent); min-height: 200vh; overflow-x: hidden; }

        /* --- HEADER ORIGINAL --- */
        .m3-header {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            color: var(--accent);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0; width: 100%; z-index: 1000;
        }

        .nav-container-left { display: flex; align-items: center; gap: 50px; }
        .brand-logo { height: 30px; width: auto; transition: var(--transition); }
        .brand-logo:hover { transform: scale(1.03); opacity: 0.9; }

        .main-menu { display: flex; gap: 32px; }
        .main-menu a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            transition: var(--transition);
            position: relative;
            padding: 8px 0;
        }
        .main-menu a::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px;
            background-color: var(--accent); transition: var(--transition);
        }
        .main-menu a:hover { color: var(--accent); }
        .main-menu a:hover::after { width: 100%; }

        .nav-container-right { display: flex; align-items: center; gap: 22px; }
        .search-wrapper {
            display: flex; align-items: center; gap: 12px; cursor: pointer;
            padding: 10px 22px; border-radius: 50px; background: var(--search-bg);
            border: 1px solid rgba(255, 255, 255, 0.05); transition: var(--transition);
        }
        .search-wrapper:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.2); }
        .search-label { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; }
        
        .icon-link { color: var(--accent); display: flex; align-items: center; transition: var(--transition); position: relative; }
        .cart-badge {
            position: absolute; top: -10px; right: -10px; background: var(--accent);
            color: #000; font-size: 9px; font-weight: 700; width: 16px; height: 16px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        /* --- HERO CAROUSEL --- */
        .hero-carousel {
            position: relative;
            width: 100%;
            height: 650px; 
            margin-top: 80px; 
            overflow: hidden;
            background: #000;
        }

        .carousel-track { width: 100%; height: 100%; position: relative; }

        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.2s ease-in-out; z-index: 1; will-change: opacity;
        }
        .slide.active { opacity: 1; z-index: 2; }

        .slide img { width: 100%; height: 100%; display: block; }

        /* Comportamento das Imagens (Requisitos de Zoom e Fit) */
        @media (min-width: 700px) {
            .slide img {
                object-fit: contain; /* Sem zoom */
                object-position: center top; /* Colado na linha da navbar */
            }
        }

        @media (max-width: 699px) {
            .hero-carousel { margin-top: 70px; height: 75vh; min-height: 520px; }
            .slide img {
                object-fit: cover; /* Preenchimento total no mobile */
                object-position: center;
            }
        }

        /* --- INDICADORES COM PROGRESSO CIRCULAR --- */
        .carousel-indicators {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 10;
        }

        .dot {
            width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative;
        }

        .dot svg { width: 18px; height: 18px; transform: rotate(-90deg); }

        .dot circle {
            fill: none;
            stroke-width: 2;
            stroke: rgba(255, 255, 255, 0.15); /* Círculo de fundo (vazio) */
        }

        .dot .progress-ring {
            stroke: var(--accent);
            stroke-dasharray: 44; /* Circunferência 2 * PI * R (R=7) */
            stroke-dashoffset: 44;
            stroke-linecap: round;
            transition: none;
        }

        /* Quando ativo, executa a animação de preenchimento */
        .dot.active .progress-ring {
            animation: fillProgress var(--autoplay-duration) linear forwards;
        }

        @keyframes fillProgress {
            from { stroke-dashoffset: 44; }
            to { stroke-dashoffset: 0; }
        }

        /* --- WHATSAPP FLUTUANTE PREMIUM --- */
        .wpp-floating {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #fff;
            z-index: 9999; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-decoration: none;
        }
        .wpp-floating svg { width: 32px; height: 32px; fill: currentColor; }
        .wpp-floating:hover {
            background: #25D366; border-color: #25D366;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(37, 211, 102, 0.4);
        }

        /* --- MENU MOBILE --- */
        #menu-toggle { display: none; }
        .menu-icon { display: none; cursor: pointer; color: var(--accent); }

        @media (max-width: 992px) {
            .m3-header { height: 70px; padding: 0 20px; }
            .menu-icon { display: block; order: -1; }
            .nav-container-left { gap: 15px; }
            .main-menu {
                position: fixed; top: 70px; left: -100%; width: 80%;
                height: calc(100vh - 70px); background: #000; flex-direction: column;
                padding: 40px; gap: 25px; transition: var(--transition);
                border-right: 1px solid var(--border-color);
            }
            #menu-toggle:checked ~ .nav-container-left .main-menu { left: 0; }
            .search-label, .icon-link:nth-of-type(1) { display: none; }
            .search-wrapper { padding: 10px; background: transparent; border: none; }
            .nav-container-right { gap: 10px; }
            .wpp-floating { width: 54px; height: 54px; bottom: 20px; right: 20px; }
            .wpp-floating svg { width: 28px; height: 28px; }
        }

        /* --- FAIXA INSTITUCIONAL PREMIUM --- */
.brand-features {
    background-color: #050505; /* Levemente diferente do preto absoluto */
    padding: 60px 5%;
    border-top: 1px solid rgba(255, 255, 255, 0.03);
    display: flex;
    justify-content: center;
    align-items: center;
}

.features-container {
    width: 100%;
    max-width: 1200px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
}

.feature-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 16px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeInUp 0.8s ease forwards;
}

/* Delay sutil para cada item */
.feature-item:nth-child(1) { animation-delay: 0.1s; }
.feature-item:nth-child(2) { animation-delay: 0.2s; }
.feature-item:nth-child(3) { animation-delay: 0.3s; }
.feature-item:nth-child(4) { animation-delay: 0.4s; }

.feature-icon {
    color: #e0e0e0;
    opacity: 0.8;
    display: flex;
    align-items: center;
    justify-content: center;
}

.feature-text {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    line-height: 1.4;
    max-width: 180px;
}

@keyframes fadeInUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsividade Mobile (Grid 2x2) */
@media (max-width: 992px) {
    .brand-features {
        padding: 50px 20px;
    }
    .features-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 40px 20px;
    }
    .feature-text {
        font-size: 10px;
        letter-spacing: 1px;
    }
}
    </style>
</head>
<body>

        <div class="nav-container-left">

    <script>
        lucide.createIcons();

        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        const duration = 6000; // 6 segundos (deve ser igual ao --autoplay-duration do CSS)
        let timer;

        function showSlide(n) {
            // Remove estados ativos
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));

            currentSlide = (n + slides.length) % slides.length;

            // Ativa novo slide e indicador
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }

        function nextSlide() {
            showSlide(currentSlide + 1);
        }

        function jumpToSlide(n) {
            clearInterval(timer);
            showSlide(n);
            startAutoPlay();
        }

        function startAutoPlay() {
            timer = setInterval(nextSlide, duration);
        }

        // Inicializa
        startAutoPlay();
    </script>
</body>
